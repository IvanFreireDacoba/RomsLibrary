# Configuración inicial de Authentik para RomsLibrary (la aplica el worker
# al arrancar; es idempotente). Crea:
#   - el usuario administrador del gestor (por defecto ADMIN / admin:
#     ¡cámbialo en cuanto entres!),
#   - el proveedor "forward auth" que protege https://<tu dominio>/gestor/,
#   - la aplicación RomsLibrary,
#   - y asigna el proveedor al outpost embebido de Authentik.
version: 1
metadata:
  name: RomsLibrary
  labels:
    blueprints.goauthentik.io/description: "Gestor web de RomsLibrary protegido por Authentik"
entries:
  - model: authentik_core.user
    state: created
    identifiers:
      username: !Env [ROMSLIBRARY_ADMIN_USUARIO, ADMIN]
    attrs:
      name: Administrador de RomsLibrary
      email: admin@romslibrary.local
      is_active: true
      password: !Env [ROMSLIBRARY_ADMIN_PASSWORD, admin]
      groups:
        - !Find [authentik_core.group, [name, "authentik Admins"]]

  - model: authentik_providers_proxy.proxyprovider
    id: proveedor-romslibrary
    identifiers:
      name: RomsLibrary (gestor)
    attrs:
      mode: forward_single
      external_host: !Env ROMSLIBRARY_URL_PUBLICA
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24
      # Desde la interfaz de Authentik se asignan solos; desde un blueprint
      # hay que listarlos o el outpost manda X-Authentik-Username vacío.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]

  - model: authentik_core.application
    identifiers:
      slug: romslibrary
    attrs:
      name: RomsLibrary
      provider: !KeyOf proveedor-romslibrary
      meta_launch_url: !Format ["%s/gestor/", !Env ROMSLIBRARY_URL_PUBLICA]
      meta_description: Gestor de la librería de juegos

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf proveedor-romslibrary
      config:
        authentik_host: !Env AUTENTICACION_URL
        authentik_host_browser: ""
